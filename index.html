<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polski YouTube - Czat i Piosenki</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0f18;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #16192b;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin: 0;
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 15px;
        }
        .section {
            margin-bottom: 14px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        input {
            background: #23273e;
            color: #fff;
            border: 1px solid #32385c;
        }
        button {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        
        #player-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #32385c;
        }
        #youtube-iframe {
            width: 100%;
            height: 200px;
            border: none;
        }
        #status-bar {
            background: #143821;
            color: #4ade80;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
        }
        #results-list {
            margin-top: 8px;
            max-height: 130px;
            overflow-y: auto;
            background: #111322;
            border: 1px solid #32385c;
            border-radius: 8px;
            display: none;
        }
        .result-item {
            padding: 8px;
            font-size: 12px;
            border-bottom: 1px solid #23273e;
            cursor: pointer;
            color: #cbd5e1;
        }
        .result-item:hover {
            background: #23273e;
            color: #fff;
        }
        #chat-box {
            height: 150px;
            background: #0d0f18;
            border: 1px solid #32385c;
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .message { margin-bottom: 6px; }
        .user { color: #93c5fd; }
        .bot { color: #86efac; }
        
        #lyrics-area {
            background: #23273e;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #d1d5db;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>POLSKI YOUTUBE</h1>
    <div class="subtitle">Wersja 2.3 – Inteligentny Tekst PL</div>

    <div class="section">
        <input type="text" id="search-input" placeholder="np. Mr Beast">
        <button onclick="searchSong()">Szukaj / Załaduj</button>
        <div id="results-list"></div>
    </div>

    <div id="status-bar">Status: Gotowy do odtwarzania</div>

    <div id="player-container">
        <iframe id="youtube-iframe" src="https://www.youtube.com/embed/NG2z0cTZr-g" allowfullscreen></iframe>
    </div>

    <div class="section" style="margin-top: 12px;">
        <div id="lyrics-area">Wpisz utwór powyżej i kliknij Szukaj.</div>
    </div>

    <div class="section">
        <label style="font-size: 13px; color: #9ca3af;">Porozmawiaj z botem:</label>
        <div id="chat-box">
            <div class="message bot">Bot: Cześć! W czym mogę Ci pomóc?</div>
        </div>
        <input type="text" id="chat-input" placeholder="Napisz wiadomość...">
        <button onclick="sendMessage()">Wyślij wiadomość</button>
    </div>
</div>

<script>
    let currentVideoId = "NG2z0cTZr-g";

    async function searchSong() {
        const query = document.getElementById('search-input').value;
        const lyricsArea = document.getElementById('lyrics-area');
        const resultsList = document.getElementById('results-list');
        
        if (!query) {
            alert('Wpisz tytuł!');
            return;
        }

        lyricsArea.innerHTML = 'Szukam utworów...';
        resultsList.style.display = 'none';
        resultsList.innerHTML = '';

        try {
            const response = await fetch(`/api/search-v2?q=${encodeURIComponent(query)}`);
            const data = await response.json();
            
            const results = Array.isArray(data) ? data : (data.items || data.results || [data]);
            
            if (results.length > 0) {
                lyricsArea.innerHTML = `<strong>Wybierz wersję z listy poniżej:</strong>`;
                resultsList.style.display = 'block';

                results.forEach(item => {
                    if (!item) return;
                    const vId = item.videoid || item.id || item.videoId;
                    const vTitle = item.title || "Film bez tytułu";
                    const vAuthor = item.author || item.channel || "";

                    if (vId) {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerText = `${vAuthor} - ${vTitle}`;
                        div.onclick = () => selectVideo(vId, vAuthor, vTitle);
                        resultsList.appendChild(div);
                    }
                });

                // Ustaw pierwszy wynik domyślnie
                const first = results.find(i => i && (i.videoid || i.id || i.videoId));
                if (first) {
                    selectVideo(first.videoid || first.id || first.videoId, first.author || first.channel || "", first.title || "");
                }
            } else {
                lyricsArea.innerHTML = `Nie znaleziono wideo.`;
            }
        } catch (error) {
            lyricsArea.innerHTML = 'Błąd wyszukiwania: ' + error.message;
        }
    }

    function selectVideo(videoId, author, title) {
        currentVideoId = videoId;
        document.getElementById('youtube-iframe').src = `https://www.youtube.com/embed/${videoId}`;
        document.getElementById('status-bar').innerHTML = `Status: Odtwarzam - ${author} ${title}`;
        document.getElementById('lyrics-area').innerHTML = `<strong>Wybrano:</strong> ${author} - ${title}`;
        document.getElementById('results-list').style.display = 'none';
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const chatBox = document.getElementById('chat-box');
        const text = input.value.trim();

        if (!text) return;

        chatBox.innerHTML += `<div class="message user">Ty: ${text}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Wysyłamy parametry w adresie URL oraz w ciele, aby backend na 100% je przechwycił
            const url = `/api/translate?videold=${currentVideoId}&videoId=${currentVideoId}&id=${currentVideoId}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: text, 
                    message: text,
                    videold: currentVideoId,
                    videoId: currentVideoId,
                    videoid: currentVideoId,
                    id: currentVideoId
                })
            });
            const data = await response.json();

            const botReply = data.reply || data.text || data.translated || data.result || data.message || JSON.stringify(data);
            chatBox.innerHTML += `<div class="message bot">Bot: ${botReply}</div>`;
        } catch (error) {
            chatBox.innerHTML += `<div class="message bot" style="color:#f87171;">Bot: Błąd połączenia z serwerem.</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
