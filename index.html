<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polski YouTube z Asystentem AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0f18;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #16192b;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin: 0;
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 15px;
        }
        .section {
            margin-bottom: 14px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        input {
            background: #23273e;
            color: #fff;
            border: 1px solid #32385c;
            outline: none;
        }
        input:focus {
            border-color: #a855f7;
        }
        button {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        
        #player-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #32385c;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        #youtube-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        #status-bar {
            background: #143821;
            color: #4ade80;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
        }
        #results-list {
            margin-top: 8px;
            max-height: 180px;
            overflow-y: auto;
            background: #111322;
            border: 1px solid #32385c;
            border-radius: 8px;
            display: none;
        }
        .result-item {
            padding: 10px;
            font-size: 12px;
            border-bottom: 1px solid #23273e;
            cursor: pointer;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-item:hover {
            background: #23273e;
            color: #fff;
        }
        
        /* Styl dedykowanego czatu AI pod odtwarzaczem */
        #ai-chat-container {
            background: #111322;
            border: 1px solid #32385c;
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
        }
        #chat-messages {
            height: 150px;
            overflow-y: auto;
            font-size: 12px;
            color: #d1d5db;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        .chat-msg {
            padding: 8px 10px;
            border-radius: 8px;
            line-height: 1.4;
        }
        .chat-msg.user {
            background: #23273e;
            color: #93c5fd;
            align-self: flex-end;
            max-width: 85%;
        }
        .chat-msg.ai {
            background: #1a1e36;
            color: #86efac;
            align-self: flex-start;
            max-width: 85%;
            border: 1px solid #32385c;
        }
        .chat-input-area {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .chat-input-area input {
            margin-top: 0;
            flex: 1;
        }
        .chat-input-area button {
            margin-top: 0;
            width: auto;
            padding: 10px 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>POLSKI YOUTUBE</h1>
    <div class="subtitle">Wersja z Asystentem AI i Odtwarzaczem</div>

    <!-- Wyszukiwarka tradycyjna -->
    <div class="section">
        <input type="text" id="search-input" placeholder="np. Miley Cyrus The Climb" onkeydown="if(event.key==='Enter') searchSong()">
        <button onclick="searchSong()">Szukaj utworów</button>
        <div id="results-list"></div>
    </div>

    <div id="status-bar">Status: Gotowy do odtwarzania</div>

    <!-- Odtwarzacz Wideo -->
    <div id="player-container">
        <iframe id="youtube-iframe" src="https://www.youtube.com/embed/kJQP7kiw5Fk" allowfullscreen></iframe>
    </div>

    <!-- Dedykowany Czat AI Pod Odtwarzaczem -->
    <div id="ai-chat-container">
        <div style="font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #a855f7;">🤖 Asystent AI (Zapytaj o piosenkę lub napisz np. "włącz Sanah")</div>
        <div id="chat-messages">
            <div class="chat-msg ai">Cześć! Jestem Twoim asystentem. Pomogę Ci znaleźć utwór, opowiem o jego tematyce lub włączę go na Twoje polecenie. W czym pomóc?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Wpisz zapytanie do AI..." onkeydown="if(event.key==='Enter') sendToAI()">
            <button onclick="sendToAI()">Wyślij</button>
        </div>
    </div>
</div>

<script>
    let currentAuthor = "Dawid Podsiadło";
    let currentTitle = "I Ciebie też bardzo";

    async function searchSong() {
        const query = document.getElementById('search-input').value.trim();
        const resultsList = document.getElementById('results-list');
        
        if (!query) return;

        resultsList.style.display = 'none';
        resultsList.innerHTML = '';

        try {
            const response = await fetch(`/api/search-v2?q=${encodeURIComponent(query)}`);
            const data = await response.json();
            const results = data.items || (Array.isArray(data) ? data : []);
            
            if (results.length > 0) {
                resultsList.style.display = 'block';
                results.slice(0, 6).forEach(item => {
                    if (!item) return;
                    const vId = item.videoId || item.videoid || item.id;
                    const vTitle = item.title || "Film bez tytułu";
                    const vAuthor = item.author || "";

                    if (vId) {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `🎵 <b>${vAuthor}</b> - ${vTitle}`;
                        div.onclick = () => selectVideo(vId, vAuthor, vTitle);
                        resultsList.appendChild(div);
                    }
                });
            }
        } catch (error) {
            console.error(error);
        }
    }

    function selectVideo(videoId, author, title) {
        currentAuthor = author;
        currentTitle = title;
        document.getElementById('player-container').innerHTML = `<iframe id="youtube-iframe" src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        document.getElementById('status-bar').innerHTML = `Status: Odtwarzam - ${author} - ${title}`;
        document.getElementById('results-list').style.display = 'none';
    }

    // Obsługa inteligentnego czatu AI pod spodem
    async function sendToAI() {
        const inputField = document.getElementById('chat-input');
        const text = inputField.value.trim();
        const chatMessages = document.getElementById('chat-messages');

        if (!text) return;

        // Dodaj wiadomość użytkownika
        chatMessages.innerHTML += `<div class="chat-msg user">${text}</div>`;
        inputField.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Sprawdzamy, czy użytkownik chce włączyć utwór (np. "włącz [tytuł]")
        if (text.toLowerCase().startsWith('włącz') || text.toLowerCase().startsWith('odtwórz')) {
            const songQuery = text.replace(/włącz|odtwórz/gi, '').trim();
            chatMessages.innerHTML += `<div class="chat-msg ai">Szukam i włączam: ${songQuery}...</div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch(`/api/search-v2?q=${encodeURIComponent(songQuery)}`);
                const data = await response.json();
                const results = data.items || (Array.isArray(data) ? data : []);

                if (results.length > 0) {
                    const first = results[0];
                    const vId = first.videoId || first.videoid || first.id;
                    const vTitle = first.title || "Tytuł";
                    const vAuthor = first.author || "";

                    if (vId) {
                        selectVideo(vId, vAuthor, vTitle);
                        chatMessages.innerHTML += `<div class="chat-msg ai">Gotowe! Odtwarzam utwór: ${vAuthor} - ${vTitle}.</div>`;
                    }
                } else {
                    chatMessages.innerHTML += `<div class="chat-msg ai">Nie udało się znaleźć takiego utworu na YouTube.</div>`;
                }
            } catch (err) {
                chatMessages.innerHTML += `<div class="chat-msg ai">Wystąpił błąd podczas wyszukiwania.</div>`;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return;
        }

        // Ogólne zapytania do AI (np. o aktualnie odtwarzany utwór lub inne pytania)
        chatMessages.innerHTML += `<div class="chat-msg ai">Myślę...</div>`;
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            // Wywołujemy Twój endpoint AI z pytaniem oraz kontekstem obecnej piosenki
            const response = await fetch(`/api/ai-lyrics?title=${encodeURIComponent(currentTitle)}&author=${encodeURIComponent(currentAuthor)}&prompt=${encodeURIComponent(text)}`);
            
            if (!response.ok) throw new Error('Błąd serwera');
            
            const aiReply = await response.text();
            
            // Usuwamy wiadomość "Myślę..." i wstawiamy odpowiedź
            chatMessages.lastChild.remove();
            chatMessages.innerHTML += `<div class="chat-msg ai">${aiReply}</div>`;
        } catch (error) {
            chatMessages.lastChild.remove();
            chatMessages.innerHTML += `<div class="chat-msg ai">Aktualnie odtwarzany utwór to: <b>${currentAuthor} - ${currentTitle}</b>. O co dokładnie chcesz zapytać? Możesz też napisać np. "włącz [nazwa piosenki]".</div>`;
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>

</body>
</html>
