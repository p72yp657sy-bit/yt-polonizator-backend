<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polski YouTube - Czat i Piosenki</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0f18;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #16192b;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin: 0;
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 15px;
        }
        .section {
            margin-bottom: 14px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        input {
            background: #23273e;
            color: #fff;
            border: 1px solid #32385c;
        }
        button {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        
        #player-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #32385c;
        }
        #youtube-iframe {
            width: 100%;
            height: 200px;
            border: none;
        }
        #status-bar {
            background: #143821;
            color: #4ade80;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
        }
        #results-list {
            margin-top: 8px;
            max-height: 140px;
            overflow-y: auto;
            background: #111322;
            border: 1px solid #32385c;
            border-radius: 8px;
            display: none;
        }
        .result-item {
            padding: 9px;
            font-size: 12px;
            border-bottom: 1px solid #23273e;
            cursor: pointer;
            color: #cbd5e1;
        }
        .result-item:hover {
            background: #23273e;
            color: #fff;
        }
        #chat-box {
            height: 140px;
            background: #0d0f18;
            border: 1px solid #32385c;
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .message { margin-bottom: 6px; line-height: 1.4; }
        .user { color: #93c5fd; }
        .bot { color: #86efac; }
        
        #lyrics-area {
            background: #23273e;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #d1d5db;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>POLSKI YOUTUBE</h1>
    <div class="subtitle">Wersja 2.3 – Inteligentny Tekst PL</div>

    <div class="section">
        <input type="text" id="search-input" placeholder="np. Dawid Podsiadło">
        <button onclick="searchSong()">Szukaj / Załaduj</button>
        <div id="results-list"></div>
    </div>

    <div id="status-bar">Status: Gotowy do odtwarzania</div>

    <div id="player-container">
        <iframe id="youtube-iframe" src="https://www.youtube.com/embed/kJQP7kiw5Fk" allowfullscreen></iframe>
    </div>

    <div class="section" style="margin-top: 12px;">
        <div id="lyrics-area">Wyszukaj utwór, aby go odtworzyć.</div>
    </div>

    <div class="section">
        <label style="font-size: 13px; color: #9ca3af;">Napisy / Tekst filmu:</label>
        <div id="chat-box">
            <div class="message bot">Bot: Wybierz film z listy i kliknij przycisk poniżej, aby pobrać jego napisy.</div>
        </div>
        <button onclick="fetchSubtitles()">Pobierz napisy wybranego filmu</button>
    </div>
</div>

<script>
    let currentVideoId = "kJQP7kiw5Fk";

    async function searchSong() {
        const query = document.getElementById('search-input').value;
        const lyricsArea = document.getElementById('lyrics-area');
        const resultsList = document.getElementById('results-list');
        
        if (!query) {
            alert('Wpisz tytuł!');
            return;
        }

        lyricsArea.innerHTML = 'Szukam utworów...';
        resultsList.style.display = 'none';
        resultsList.innerHTML = '';

        try {
            const response = await fetch(`/api/search-v2?q=${encodeURIComponent(query)}`);
            const data = await response.json();
            
            // Obsługujemy format { items: [...] } zwrócony przez Twój backend
            const results = data.items || (Array.isArray(data) ? data : []);
            
            if (results.length > 0) {
                lyricsArea.innerHTML = `<strong>Wybierz wersję z listy poniżej:</strong>`;
                resultsList.style.display = 'block';

                results.forEach(item => {
                    if (!item) return;
                    const vId = item.videoId || item.videoid || item.id;
                    const vTitle = item.title || "Film bez tytułu";
                    const vAuthor = item.author || "";

                    if (vId) {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerText = `${vAuthor} - ${vTitle}`;
                        div.onclick = () => selectVideo(vId, vAuthor, vTitle);
                        resultsList.appendChild(div);
                    }
                });

                // Automatycznie wybierz pierwszy film z listy
                const first = results[0];
                if (first && (first.videoId || first.videoid)) {
                    selectVideo(first.videoId || first.videoid, first.author || "", first.title || "");
                }
            } else {
                lyricsArea.innerHTML = `Nie znaleziono wideo.`;
            }
        } catch (error) {
            lyricsArea.innerHTML = 'Błąd wyszukiwania: ' + error.message;
        }
    }

    function selectVideo(videoId, author, title) {
        currentVideoId = videoId;
        document.getElementById('youtube-iframe').src = `https://www.youtube.com/embed/${videoId}`;
        document.getElementById('status-bar').innerHTML = `Status: Odtwarzam - ${author} ${title}`;
        document.getElementById('lyrics-area').innerHTML = `<strong>Wybrano:</strong> ${author} - ${title}`;
        document.getElementById('results-list').style.display = 'none';
    }

        async function fetchSubtitles() {
        const chatBox = document.getElementById('chat-box');

        chatBox.innerHTML += `<div class="message user">Pobieram napisy (ID: ${currentVideoId})...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Przeglądarka użytkownika odpytuje bezpośrednio publiczny endpoint YouTube
            const response = await fetch(`https://www.youtube.com/api/timedtext?v=${currentVideoId}&lang=pl`, {
                mode: 'cors'
            });
            
            if (!response.ok) {
                throw new Error('Brak napisów PL');
            }

            const subtitlesText = await response.text();
            
            if (!subtitlesText || subtitlesText.includes('<error>') || subtitlesText.trim() === '') {
                throw new Error('Pusty plik napisów');
            }

            const shortText = subtitlesText.replace(/<[^>]*>?/gm, '').substring(0, 250) + '...';
            chatBox.innerHTML += `<div class="message bot">Sukces! Napisy:<br><span style="color:#d1d5db;">${shortText}</span></div>`;
        } catch (error) {
            // Jeśli przeglądarka dostanie CORS, wysyłamy użytkownika bezpośrednio do transkryptu
            chatBox.innerHTML += `<div class="message bot" style="color:#f87171;">Bot: YouTube blokuje bezpośredni odczyt. <a href="https://www.youtube.com/watch?v=${currentVideoId}" target="_blank" style="color: #93c5fd;">Kliknij tutaj, aby zobaczyć transkrypt na YouTube</a></div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    }
</script>

</body>
</html>
