<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polski YouTube - Piosenki i Teksty</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0f18;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #16192b;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin: 0;
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 15px;
        }
        .section {
            margin-bottom: 14px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        input {
            background: #23273e;
            color: #fff;
            border: 1px solid #32385c;
            outline: none;
        }
        input:focus {
            border-color: #a855f7;
        }
        button {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        
        #player-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #32385c;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        #youtube-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        #status-bar {
            background: #143821;
            color: #4ade80;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
        }
        #results-list {
            margin-top: 8px;
            max-height: 180px;
            overflow-y: auto;
            background: #111322;
            border: 1px solid #32385c;
            border-radius: 8px;
            display: none;
        }
        .result-item {
            padding: 10px;
            font-size: 12px;
            border-bottom: 1px solid #23273e;
            cursor: pointer;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-item:hover {
            background: #23273e;
            color: #fff;
        }
        #lyrics-area {
            background: #23273e;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #d1d5db;
            text-align: center;
        }
        a.lyrics-link {
            color: #f9d423;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>POLSKI YOUTUBE</h1>
    <div class="subtitle">Wersja Stabilna – Wyszukiwarka i Odtwarzacz</div>

    <div class="section">
        <input type="text" id="search-input" placeholder="np. Miley Cyrus The Climb" onkeydown="if(event.key==='Enter') searchSong()">
        <button onclick="searchSong()">Szukaj utworów</button>
        <div id="results-list"></div>
    </div>

    <div id="status-bar">Status: Gotowy do odtwarzania</div>

    <div id="player-container">
        <iframe id="youtube-iframe" src="https://www.youtube.com/embed/kJQP7kiw5Fk" allowfullscreen></iframe>
    </div>

    <div class="section" style="margin-top: 12px;">
        <div id="lyrics-area">Wyszukaj i wybierz utwór z listy powyżej.</div>
    </div>
</div>

<script>
    let currentTitle = "I Ciebie też bardzo";
    let currentAuthor = "Dawid Podsiadło";

    async function searchSong() {
        const query = document.getElementById('search-input').value.trim();
        const lyricsArea = document.getElementById('lyrics-area');
        const resultsList = document.getElementById('results-list');
        
        if (!query) {
            alert('Wpisz tytuł piosenki!');
            return;
        }

        lyricsArea.innerHTML = 'Szukam utworów...';
        resultsList.style.display = 'none';
        resultsList.innerHTML = '';

        try {
            const response = await fetch(`/api/search-v2?q=${encodeURIComponent(query)}`);
            const data = await response.json();
            
            const results = data.items || (Array.isArray(data) ? data : []);
            
            if (results.length > 0) {
                lyricsArea.innerHTML = `<strong>Wybierz właściwą wersję z listy poniżej:</strong>`;
                resultsList.style.display = 'block';

                results.slice(0, 6).forEach(item => {
                    if (!item) return;
                    const vId = item.videoId || item.videoid || item.id;
                    const vTitle = item.title || "Film bez tytułu";
                    const vAuthor = item.author || "";

                    if (vId) {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `🎵 <b>${vAuthor}</b> - ${vTitle}`;
                        div.onclick = () => selectVideo(vId, vAuthor, vTitle);
                        resultsList.appendChild(div);
                    }
                });
            } else {
                lyricsArea.innerHTML = `Nie znaleziono wideo.`;
            }
        } catch (error) {
            lyricsArea.innerHTML = 'Błąd wyszukiwania: ' + error.message;
        }
    }

    function selectVideo(videoId, author, title) {
        currentAuthor = author;
        currentTitle = title;

        // Włączamy wideo
        document.getElementById('player-container').innerHTML = `<iframe id="youtube-iframe" src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        
        document.getElementById('status-bar').innerHTML = `Status: Odtwarzam - ${author} - ${title}`;
        
        // Dajemy czysty, działający podgląd z linkiem do tekstu, zamiast zacinającego się AI
        const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(author + " " + title + " tekst tłumaczenie")}`;
        document.getElementById('lyrics-area').innerHTML = `
            <strong>Wybrano:</strong> ${author} - ${title}<br>
            <div style="margin-top: 8px;">
                <a href="${googleSearchUrl}" target="_blank" class="lyrics-link">🔍 Sprawdź tekst i tłumaczenie w Google</a>
            </div>
        `;
        
        document.getElementById('results-list').style.display = 'none';
    }
</script>

</body>
</html>
