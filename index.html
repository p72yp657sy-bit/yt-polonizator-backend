<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polski YouTube - Wersja 4.0 AI</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .brand-title {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(to right, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 5px;
        }
        .brand-subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 10px;
        }
        #song-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
        }
        #send-btn {
            padding: 0 20px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(to right, #ec4899, #8b5cf6);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        #results-list {
            width: 100%;
            max-width: 500px;
            max-height: 150px;
            overflow-y: auto;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .result-item {
            padding: 10px;
            font-size: 0.9rem;
            border-bottom: 1px solid #334155;
            cursor: pointer;
            color: #cbd5e1;
        }
        .result-item:hover {
            background: #334155;
            color: #fff;
        }
        .player-container {
            width: 100%;
            max-width: 500px;
            height: 280px;
            background-color: #1e293b;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #status {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            background-color: #065f46;
            color: #d1fae5;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            box-sizing: border-box;
        }
        .lyrics-grid {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }
        .lyrics-box {
            flex: 1;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #334155;
            box-sizing: border-box;
        }
        .lyrics-box h3 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="brand-title">POLSKI YOUTUBE</div>
    <div class="brand-subtitle">WERSJA 4.0 – KAFELKI I TEKSTY AI</div>

    <div class="input-group">
        <input type="text" id="song-input" placeholder="Wpisz wykonawcę lub tytuł...">
        <button id="send-btn" onclick="searchSong()">Szukaj</button>
    </div>
    <div id="results-list"></div>

    <div id="status">Status: Gotowy do wyszukiwania</div>

    <div class="player-container">
        <iframe id="youtube-iframe" src="https://www.youtube.com/embed/kJQP7kiw5Fk" allowfullscreen></iframe>
    </div>

    <div class="lyrics-grid">
        <div class="lyrics-box">
            <h3>Tekst / Tłumaczenie AI</h3>
            <p id="ai-lyrics-text" style="color: #38bdf8; font-weight: normal; white-space: pre-line;">Wyszukaj i wybierz utwór, aby wygenerować tekst przez AI...</p>
        </div>
    </div>

    <script>
        let currentTitle = "I Ciebie też bardzo";
        let currentAuthor = "Dawid Podsiadło";

        async function searchSong() {
            const query = document.getElementById('song-input').value.trim();
            const resultsList = document.getElementById('results-list');
            
            if (!query) {
                alert('Wpisz szukaną frazę!');
                return;
            }

            document.getElementById('status').innerText = 'Szukam utworów...';
            resultsList.style.display = 'none';
            resultsList.innerHTML = '';

            try {
                const response = await fetch(`/api/search-v2?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                const results = data.items || (Array.isArray(data) ? data : []);
                
                if (results.length > 0) {
                    resultsList.style.display = 'block';
                    document.getElementById('status').innerText = 'Wybierz utwór z listy poniżej:';

                    results.forEach(item => {
                        if (!item) return;
                        const vId = item.videoId || item.videoid || item.id;
                        const vTitle = item.title || "Film bez tytułu";
                        const vAuthor = item.author || "";

                        if (vId) {
                            const div = document.createElement('div');
                            div.className = 'result-item';
                            div.innerText = `${vAuthor} - ${vTitle}`;
                            div.onclick = () => selectAndFetch(vId, vAuthor, vTitle);
                            resultsList.appendChild(div);
                        }
                    });

                    // Wybierz automatycznie pierwszy wynik
                    const first = results[0];
                    if (first && (first.videoId || first.videoid)) {
                        selectAndFetch(first.videoId || first.videoid, first.author || "", first.title || "");
                    }
                } else {
                    document.getElementById('status').innerText = 'Nie znaleziono wideo.';
                }
            } catch (error) {
                document.getElementById('status').innerText = 'Błąd wyszukiwania.';
                console.error(error);
            }
        }

        async function selectAndFetch(videoId, author, title) {
            currentVideoId = videoId;
            currentAuthor = author;
            currentTitle = title;

            // Ustaw odtwarzacz
            document.getElementById('youtube-iframe').src = `https://www.youtube.com/embed/${videoId}`;
            document.getElementById('status').innerText = `Odtwarzam: ${author} - ${title}`;
            document.getElementById('results-list').style.display = 'none';
            document.getElementById('ai-lyrics-text').innerText = 'Generowanie tekstu i tłumaczenia przez AI...';

            // Pobierz tekst z AI
            try {
                const response = await fetch(`/api/ai-lyrics?title=${encodeURIComponent(title)}&author=${encodeURIComponent(author)}`);
                const aiText = await response.text();
                document.getElementById('ai-lyrics-text').innerText = aiText;
            } catch (error) {
                document.getElementById('ai-lyrics-text').innerText = 'Nie udało się pobrać tekstu od AI.';
            }
        }

        document.getElementById('song-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchSong();
            }
        });
    </script>
</body>
</html>
