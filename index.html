<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polski YouTube - Czat i Piosenki</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0f18;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #16192b;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin: 0;
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 15px;
        }
        .section {
            margin-bottom: 14px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        input {
            background: #23273e;
            color: #fff;
            border: 1px solid #32385c;
            outline: none;
        }
        input:focus {
            border-color: #a855f7;
        }
        button {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        
        #player-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #32385c;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        #youtube-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        #status-bar {
            background: #143821;
            color: #4ade80;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
        }
        #results-list {
            margin-top: 8px;
            max-height: 180px;
            overflow-y: auto;
            background: #111322;
            border: 1px solid #32385c;
            border-radius: 8px;
            display: none;
        }
        .result-item {
            padding: 10px;
            font-size: 12px;
            border-bottom: 1px solid #23273e;
            cursor: pointer;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-item:hover {
            background: #23273e;
            color: #fff;
        }
        #chat-box {
            height: 160px;
            background: #0d0f18;
            border: 1px solid #32385c;
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .message { margin-bottom: 8px; line-height: 1.4; }
        .user { color: #93c5fd; }
        .bot { color: #86efac; }
        
        #lyrics-area {
            background: #23273e;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #d1d5db;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>POLSKI YOUTUBE</h1>
    <div class="subtitle">Wersja Stabilna – Wybór z Listy i Napisy PL</div>

    <div class="section">
        <input type="text" id="search-input" placeholder="np. Miley Cyrus The Climb" onkeydown="if(event.key==='Enter') searchSong()">
        <button onclick="searchSong()">Szukaj utworów</button>
        <div id="results-list"></div>
    </div>

    <div id="status-bar">Status: Gotowy do odtwarzania</div>

    <div id="player-container">
        <iframe id="youtube-iframe" src="https://www.youtube.com/embed/kJQP7kiw5Fk?cc_load_policy=1&hl=pl&cc_lang_pref=pl" allowfullscreen></iframe>
    </div>

    <div class="section" style="margin-top: 12px;">
        <div id="lyrics-area">Wyszukaj i wybierz utwór z listy powyżej.</div>
    </div>

    <div class="section">
        <label style="font-size: 13px; color: #9ca3af;">Tekst / Napisy od AI:</label>
        <div id="chat-box">
            <div class="message bot">Bot: Wybierz film z listy i kliknij przycisk poniżej, aby wygenerować tekst utworu przez AI.</div>
        </div>
        <button onclick="fetchSubtitles()">Pobierz tekst wybranego filmu (AI)</button>
    </div>
</div>

<script>
    let currentVideoId = "kJQP7kiw5Fk";
    let currentTitle = "I Ciebie też bardzo";
    let currentAuthor = "Dawid Podsiadło";

    async function searchSong() {
        const query = document.getElementById('search-input').value.trim();
        const lyricsArea = document.getElementById('lyrics-area');
        const resultsList = document.getElementById('results-list');
        
        if (!query) {
            alert('Wpisz tytuł!');
            return;
        }

        lyricsArea.innerHTML = 'Szukam utworów...';
        resultsList.style.display = 'none';
        resultsList.innerHTML = '';

        try {
            const response = await fetch(`/api/search-v2?q=${encodeURIComponent(query)}`);
            const data = await response.json();
            
            const results = data.items || (Array.isArray(data) ? data : []);
            
            if (results.length > 0) {
                lyricsArea.innerHTML = `<strong>Wybierz właściwą wersję z listy poniżej:</strong>`;
                resultsList.style.display = 'block';

                results.slice(0, 6).forEach(item => {
                    if (!item) return;
                    const vId = item.videoId || item.videoid || item.id;
                    const vTitle = item.title || "Film bez tytułu";
                    const vAuthor = item.author || "";

                    if (vId) {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `🎵 <b>${vAuthor}</b> - ${vTitle}`;
                        div.onclick = () => selectVideo(vId, vAuthor, vTitle);
                        resultsList.appendChild(div);
                    }
                });
            } else {
                lyricsArea.innerHTML = `Nie znaleziono wideo.`;
            }
        } catch (error) {
            lyricsArea.innerHTML = 'Błąd wyszukiwania: ' + error.message;
        }
    }

    function selectVideo(videoId, author, title) {
        currentVideoId = videoId;
        
        // Inteligentne czyszczenie ze śmieci YouTube (VEVO, Official, nawiasy), żeby AI nie głupiało
        let cleanAuthor = author.replace(/VEVO/gi, '').replace(/- Topic/gi, '').replace(/Records/gi, '').trim();
        let cleanTitle = title.replace(/\(Official.*?\)/gi, '').replace(/\[Official.*?\]/gi, '').replace(/official music video/gi, '').trim();

        currentAuthor = cleanAuthor || author;
        currentTitle = cleanTitle || title;

        // Wstawiamy iframe z parametrami wymuszającymi polskie napisy i autostart
        const playerContainer = document.getElementById('player-container');
        playerContainer.innerHTML = `<iframe id="youtube-iframe" src="https://www.youtube.com/embed/${videoId}?autoplay=1&cc_load_policy=1&hl=pl&cc_lang_pref=pl" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        
        document.getElementById('status-bar').innerHTML = `Status: Odtwarzam - ${currentAuthor} - ${currentTitle}`;
        document.getElementById('lyrics-area').innerHTML = `<strong>Wybrano:</strong> ${currentAuthor} - ${currentTitle}`;
        document.getElementById('results-list').style.display = 'none';
    }

    async function fetchSubtitles() {
        const chatBox = document.getElementById('chat-box');

        chatBox.innerHTML += `<div class="message user">Generuję tekst przez AI dla: ${currentAuthor} - ${currentTitle}...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`/api/ai-lyrics?title=${encodeURIComponent(currentTitle)}&author=${encodeURIComponent(currentAuthor)}`);
            
            if (!response.ok) {
                throw new Error('Błąd serwera AI');
            }

            const aiText = await response.text();
            
            chatBox.innerHTML += `<div class="message bot"><strong>Tekst od AI:</strong><br><div style="max-height: 140px; overflow-y: auto; color:#d1d5db; margin-top: 4px; white-space: pre-line;">${aiText}</div></div>`;
        } catch (error) {
            chatBox.innerHTML += `<div class="message bot" style="color:#f87171;>Bot: Nie udało się pobrać tekstu. Spróbuj wybrać inny kafelek z listy.</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
